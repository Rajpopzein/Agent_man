[package]
name = "agent-man-desktop"
version = "0.1.0"
description = "Agent Man Windows desktop host"
authors = ["Rajkumar"]
edition = "2021"

[[bin]]
name = "agent-man"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
