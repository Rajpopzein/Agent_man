name: windows-desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "runtime/**"
      - "scripts/build-desktop.ps1"
      - ".github/workflows/windows-desktop.yml"
  push:
    branches:
      - professional-ui
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "runtime/**"
      - "scripts/build-desktop.ps1"
      - ".github/workflows/windows-desktop.yml"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Build Python runtime sidecar
        shell: pwsh
        run: |
          python -m pip install -r .\runtime\requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --name agent-man-runtime --paths .\runtime --collect-all uvicorn --collect-all fastapi .\runtime\desktop_entry.py
          $HostLine = rustc -vV | Select-String "^host:"
          $HostTriple = ($HostLine.ToString() -replace "^host:\s*", "").Trim()
          $BinaryDir = ".\apps\desktop\src-tauri\binaries"
          New-Item -ItemType Directory -Force -Path $BinaryDir | Out-Null
          Copy-Item ".\dist\agent-man-runtime.exe" (Join-Path $BinaryDir ("agent-man-runtime-" + $HostTriple + ".exe")) -Force

      - name: Build React UI
        shell: pwsh
        run: |
          npm.cmd --prefix .\apps\web install
          Remove-Item Env:VITE_API_BASE -ErrorAction SilentlyContinue
          npm.cmd --prefix .\apps\web run build

      - name: Install desktop dependencies
        shell: pwsh
        run: npm.cmd --prefix .\apps\desktop install

      - name: Build Agent Man EXE
        shell: pwsh
        run: npm.cmd --prefix .\apps\desktop run build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: agent-man-windows
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/agent-man.exe
